<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNPM Sevivon</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f4d03f;
            --gold-dark: #996515;
            --blue-deep: #0c1445;
            --blue-mid: #1a237e;
            --purple-accent: #7c4dff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-mid) 50%, #311b92 100%);
            overflow: hidden;
            position: relative;
        }

        /* Decorative stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, white, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 350px 200px, white, transparent),
                radial-gradient(2px 2px at 420px 100px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 500px 180px, white, transparent),
                radial-gradient(2px 2px at 580px 60px, rgba(255,255,255,0.9), transparent);
            background-size: 600px 250px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        h1 {
            color: var(--gold-light);
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
            z-index: 10;
        }

        .scene {
            width: 200px;
            height: 320px;
            perspective: 1000px;
            z-index: 10;
        }

        .sevivon {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .sevivon.spinning {
            animation: spin 0.15s linear infinite;
        }

        .sevivon.slowing {
            animation: spinSlow 3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        @keyframes spinSlow {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(2160deg); }
        }

        /* Handle (top part) */
        .handle {
            position: absolute;
            width: 30px;
            height: 60px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold), var(--gold-dark));
            border-radius: 8px 8px 4px 4px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.3);
        }

        .handle::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold), var(--gold-dark));
            border-radius: 50% 50% 0 0;
        }

        /* Body container */
        .body {
            position: absolute;
            width: 120px;
            height: 120px;
            left: 50%;
            top: 70px;
            transform-style: preserve-3d;
            transform: translateX(-50%);
        }

        /* Sides of the dreidel body */
        .side {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 900;
            color: var(--blue-deep);
            text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
            background: linear-gradient(145deg, var(--gold-light), var(--gold), var(--gold-dark));
            border: 3px solid var(--gold-dark);
            box-shadow: inset 0 0 30px rgba(255,255,255,0.3), inset 0 0 10px rgba(0,0,0,0.1);
            backface-visibility: visible;
        }

        .side-front {
            transform: translateZ(60px);
        }

        .side-back {
            transform: rotateY(180deg) translateZ(60px);
        }

        .side-right {
            transform: rotateY(90deg) translateZ(60px);
        }

        .side-left {
            transform: rotateY(-90deg) translateZ(60px);
        }

        /* Bottom pyramid point */
        .point {
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 190px;
            transform-style: preserve-3d;
            transform: translateX(-50%);
        }

        .point-face {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-top: 100px solid var(--gold);
            transform-origin: top center;
        }

        .point-front {
            transform: translateX(-60px) rotateX(-30deg) translateZ(60px);
            border-top-color: var(--gold-light);
        }

        .point-back {
            transform: translateX(-60px) rotateY(180deg) rotateX(-30deg) translateZ(60px);
            border-top-color: var(--gold-dark);
        }

        .point-right {
            transform: translateX(-60px) rotateY(90deg) rotateX(-30deg) translateZ(60px);
            border-top-color: var(--gold);
        }

        .point-left {
            transform: translateX(-60px) rotateY(-90deg) rotateX(-30deg) translateZ(60px);
            border-top-color: #c9a227;
        }

        /* Spin button */
        .spin-btn {
            margin-top: 3rem;
            padding: 1rem 3rem;
            font-family: 'Rubik', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--blue-deep);
            background: linear-gradient(145deg, var(--gold-light), var(--gold));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4), 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        .spin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }

        .spin-btn:hover::before {
            left: 100%;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5), 0 6px 15px rgba(0,0,0,0.25);
        }

        .spin-btn:active {
            transform: translateY(0);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Result display */
        .result {
            margin-top: 2rem;
            font-size: 2rem;
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            min-height: 3rem;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .result.show {
            opacity: 1;
        }

        /* Glow effect under sevivon */
        .glow {
            position: absolute;
            width: 150px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(212, 175, 55, 0.4), transparent 70%);
            border-radius: 50%;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(10px);
        }

        .scene-container {
            position: relative;
            z-index: 10;
        }

        /* Menorah decoration */
        .decoration {
            position: fixed;
            bottom: 20px;
            font-size: 3rem;
            opacity: 0.3;
        }

        .decoration.left { left: 30px; }
        .decoration.right { right: 30px; }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <h1>✡ PNPM Sevivon ✡</h1>
    
    <div class="scene-container">
        <div class="scene">
            <div class="sevivon" id="sevivon">
                <div class="handle"></div>
                <div class="body">
                    <div class="side side-front">P</div>
                    <div class="side side-right">N</div>
                    <div class="side side-back">P</div>
                    <div class="side side-left">M</div>
                </div>
                <div class="point">
                    <div class="point-face point-front"></div>
                    <div class="point-face point-right"></div>
                    <div class="point-face point-back"></div>
                    <div class="point-face point-left"></div>
                </div>
            </div>
        </div>
        <div class="glow"></div>
    </div>
    
    <button class="spin-btn" id="spinBtn">🎲 Spin!</button>
    
    <div class="result" id="result"></div>
    
    <div class="decoration left">🕎</div>
    <div class="decoration right">🕎</div>

    <script>
        const sevivon = document.getElementById('sevivon');
        const spinBtn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        
        const sides = [
            { letter: 'P', meaning: '⚡ P - Performant!' },
            { letter: 'M', meaning: '🔧 M - Manager!' },
            { letter: 'P', meaning: '📦 P - Package!' },
            { letter: 'N', meaning: '💚 N - Node!' },
        ];
        
        let isSpinning = false;
        
        function spin() {
            if (isSpinning) return;

            window.location.hash = "spin";
            
            isSpinning = true;
            spinBtn.disabled = true;
            result.classList.remove('show');
            
            // Reset any previous animation
            sevivon.classList.remove('slowing');
            sevivon.style.transform = '';
            
            // Force reflow
            void sevivon.offsetWidth;
            
            // Start spinning fast
            sevivon.classList.add('spinning');
            
            // Random spin duration between 2-4 seconds
            const spinDuration = 2000 + Math.random() * 2000;
            
            setTimeout(() => {
                // Stop fast spinning
                sevivon.classList.remove('spinning');
                
                // Pick a random side index (0-3)
                const sideIndex = Math.floor(Math.random() * 4);
                const chosenSide = sides[sideIndex];
                const finalRotation = sideIndex * 90;
                
                // Set final position after animation
                sevivon.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.3, 1)';
                sevivon.style.transform = `rotateY(${2160 + finalRotation}deg)`;
                
                setTimeout(() => {
                    // Show result
                    result.textContent = chosenSide.meaning;
                    result.classList.add('show');
                    
                    // Reset for next spin
                    isSpinning = false;
                    spinBtn.disabled = false;
                    sevivon.style.transition = 'none';
                }, 3000);
                
            }, spinDuration);
        }
        
        spinBtn.addEventListener('click', spin);
        
        // Allow spacebar to spin
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isSpinning) {
                e.preventDefault();
                spin();
            }
        });

        // Allow linking directly to a spin via URL
        window.addEventListener("load", () => {
            if (window.location.hash === "#spin") {
                setTimeout(spin, 500);
            }
        });
    </script>
</body>
</html>
