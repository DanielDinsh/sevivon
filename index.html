<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Management Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f8fafc;
    }

    header span {
      font-size: 13px;
      color: #64748b;
      font-family: monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: #1e2330;
      border: 1px solid #2d3347;
      border-radius: 12px;
      padding: 20px 22px;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: #4a5568; }

    .card .label {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      color: #f8fafc;
    }

    .card .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .card.total { border-color: #3b82f6; }
    .card.total .value { color: #60a5fa; }

    .error {
      background: #2d1b1b;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 16px 20px;
      color: #fca5a5;
      font-size: 14px;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #64748b;
      font-size: 14px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #2d3347;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .trend-section { margin-top: 8px; }

    .trend-section h2 {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      color: #64748b;
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      border-bottom: 1px solid #2d3347;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e2330;
      color: #cbd5e1;
    }

    tr:last-child td { border-bottom: none; }

    .bar-wrap {
      height: 6px;
      background: #2d3347;
      border-radius: 3px;
      overflow: hidden;
      width: 120px;
    }

    .bar {
      height: 100%;
      border-radius: 3px;
      background: #3b82f6;
    }

    .refreshed {
      font-size: 12px;
      color: #475569;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<header>
  <h1>Case Management</h1>
  <span id="ws-label">Loading...</span>
</header>

<div id="root"><div class="loading"><div class="spinner"></div> Fetching data…</div></div>
<p class="refreshed" id="ts"></p>

<script>
  const BASE  = 'https://raztest.dev-app.blinkops.com';
  const WS_ID = '3811e709-f741-4a96-93b2-54e6cf98e655';
  const KEY   = 'pnpm';

  const HEADERS = {
    'X-Api-Key': KEY,
    'Content-Type': 'application/json',
  };

  const STATUS_COLORS = {
    open:          '#3b82f6',
    'in-progress': '#f59e0b',
    in_progress:   '#f59e0b',
    resolved:      '#10b981',
    closed:        '#6b7280',
    new:           '#8b5cf6',
  };

  function colorFor(status) {
    const k = (status || '').toLowerCase().replace(/\s+/g, '_');
    return STATUS_COLORS[k] || '#64748b';
  }

  async function api(path) {
    const res = await fetch(`${BASE}${path}`, { headers: HEADERS });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${path}`);
    return res.json();
  }

  function render(html) {
    document.getElementById('root').innerHTML = html;
  }

  async function load() {
    try {
      document.getElementById('ws-label').textContent = `workspace ${WS_ID.slice(0, 8)}…`;

      // Fetch status breakdown and total in parallel
      const [statuses, trend] = await Promise.allSettled([
        api(`/api/v1/case_management/table/cases/statuses_count`),
        api(`/api/v1/case_management/table/cases/trend`),
      ]);

      let totalCases = 0;
      let statusData = [];

      if (statuses.status === 'fulfilled') {
        const raw = statuses.value;
        // Response is an object like { open: 12, closed: 5, ... } or [{status, count}]
        if (Array.isArray(raw)) {
          statusData = raw;
          totalCases = raw.reduce((s, x) => s + (x.count || x.total || 0), 0);
        } else if (raw && typeof raw === 'object') {
          statusData = Object.entries(raw).map(([status, count]) => ({ status, count: Number(count) }));
          totalCases = statusData.reduce((s, x) => s + x.count, 0);
        }
      }

      // Build status cards
      const cards = statusData.map(({ status, count }) => `
        <div class="card">
          <div class="label">
            <span class="dot" style="background:${colorFor(status)}"></span>${status}
          </div>
          <div class="value">${count.toLocaleString()}</div>
        </div>
      `).join('');

      // Trend table if available
      let trendHtml = '';
      if (trend.status === 'fulfilled' && trend.value) {
        const rows = Array.isArray(trend.value) ? trend.value : trend.value.data || [];
        if (rows.length) {
          const maxVal = Math.max(...rows.map(r => r.count || r.total || r.value || 0), 1);
          trendHtml = `
            <div class="trend-section">
              <h2>Cases over time</h2>
              <table>
                <thead><tr><th>Period</th><th>Cases</th><th></th></tr></thead>
                <tbody>
                  ${rows.slice(-10).map(r => {
                    const val = r.count || r.total || r.value || 0;
                    const pct = Math.round((val / maxVal) * 100);
                    const label = r.date || r.period || r.label || '';
                    return `<tr>
                      <td>${label}</td>
                      <td>${val.toLocaleString()}</td>
                      <td><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>`;
        }
      }

      render(`
        <div class="grid">
          <div class="card total">
            <div class="label">Total Cases</div>
            <div class="value">${totalCases.toLocaleString()}</div>
          </div>
          ${cards}
        </div>
        ${trendHtml}
      `);

      document.getElementById('ts').textContent =
        `Last refreshed: ${new Date().toLocaleTimeString()}`;

    } catch (err) {
      render(`<div class="error"><strong>Error:</strong> ${err.message}</div>`);
      console.error(err);
    }
  }

  load();
</script>
</body>
</html>
